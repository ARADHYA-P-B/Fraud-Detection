services:
  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  ingestion-service:
    build:
      context: ./services/ingestion-service
      dockerfile: Dockerfile
    container_name: fraud-ingestion
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  case-management:
    build:
      context: ./services/case-management
      dockerfile: Dockerfile
    container_name: fraud-case-mgmt
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    environment:
      - SQLITE_DB_PATH=/app/data/fraud_cases.db
    restart: unless-stopped

  inference-engine:
    build:
      context: ./services/inference-engine
      dockerfile: Dockerfile
    container_name: fraud-inference-worker
    volumes:
      - ./data:/app/data
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SQLITE_DB_PATH=/app/data/fraud_cases.db
    depends_on:
      - redis
      - case-management
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_INGEST_API_URL: http://localhost:8000/api/v1
        VITE_CASE_API_URL: http://localhost:8001/api/v1
    container_name: fraud-frontend
    ports:
      - "80:80"
    depends_on:
      - ingestion-service
      - case-management
    restart: unless-stopped