frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraud_investigator_ui
    ports:
      - "5173:5173"
    environment:
      - VITE_CASE_API_URL=http://localhost:8001/api/v1
      - VITE_INGEST_API_URL=http://localhost:8000/api/v1
    depends_on:
      - case-management
      - Ingestion-service